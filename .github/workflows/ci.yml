name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - name: Extension tests
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Run the extension tests
        if: matrix.os == 'ubuntu-latest'
        working-directory: extension
        run: node --test
      - name: Cross-build every release target without cgo
        # The Windows-only files (tray, installer) are not compiled on this
        # runner otherwise, and a cgo dependency would break the release.
        if: matrix.os == 'ubuntu-latest'
        run: |
          for t in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            echo "$t"
            CGO_ENABLED=0 GOOS=${t%/*} GOARCH=${t#*/} go build -o /dev/null ./cmd/cortex
          done
          GOOS=windows go vet ./...
      - name: Third-party licences are up to date
        # THIRD_PARTY_LICENSES.md ships in every release archive: regenerate it
        # and fail if the committed file differs.
        if: matrix.os == 'ubuntu-latest'
        run: |
          scripts/licenses.sh
          test -z "$(git status --porcelain -- THIRD_PARTY_LICENSES.md)" || { git diff --exit-code -- THIRD_PARTY_LICENSES.md; echo "THIRD_PARTY_LICENSES.md is not committed or out of date: run scripts/licenses.sh and commit it" >&2; exit 1; }
      - name: Build
        if: matrix.os != 'windows-latest'
        run: go build -o dist/ ./cmd/cortex
      - name: Build (Windows, no console window)
        if: matrix.os == 'windows-latest'
        env:
          CGO_ENABLED: "0"
        run: go build -ldflags "-H windowsgui" -o dist/ ./cmd/cortex
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cortex-${{ matrix.os }}
          path: dist/
