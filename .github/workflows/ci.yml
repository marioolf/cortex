name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - name: Cross-build every release target without cgo
        # The Windows-only files (tray, installer) are not compiled on this
        # runner otherwise, and a cgo dependency would break the release.
        if: matrix.os == 'ubuntu-latest'
        run: |
          for t in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            echo "$t"
            CGO_ENABLED=0 GOOS=${t%/*} GOARCH=${t#*/} go build -o /dev/null ./cmd/cortex
          done
          GOOS=windows go vet ./...
      - name: Build
        if: matrix.os != 'windows-latest'
        run: go build -o dist/ ./cmd/cortex
      - name: Build (Windows, no console window)
        if: matrix.os == 'windows-latest'
        env:
          CGO_ENABLED: "0"
        run: go build -ldflags "-H windowsgui" -o dist/ ./cmd/cortex
      - uses: actions/upload-artifact@v4
        with:
          name: cortex-${{ matrix.os }}
          path: dist/
