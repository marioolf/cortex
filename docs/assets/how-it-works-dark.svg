<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" role="img" aria-labelledby="t d">
<title id="t">How Cortex works</title>
<desc id="d">Coding assistants and web chats feed Cortex (cortex run), which redacts secrets and writes Markdown notes to the vault. cortex mcp lets AI agents search, read and list recent notes. You can open the vault in Obsidian or any editor.</desc>
